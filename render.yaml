services:
  # 1. Backend API + Servidor MCP (Node.js Web Service)
  - type: web
    name: brainboard-backend
    runtime: node
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend Web (Static Site)
  - type: web
    name: brainboard-frontend
    runtime: static
    rootDir: frontend
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
